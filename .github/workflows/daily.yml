name: 会议转写-每日管线

on:
  # 内部 schedule 已禁用：GitHub 定时事件 best-effort、无 SLA，实测稳定延迟 4.75h+。
  # 改由外部定时器（cron-job.org 等）调用 workflow_dispatch 准点触发，详见 RUNBOOK §可靠触发。
  # schedule:
  #   - cron: '36 1 * * *'   # 北京时间 09:36 = UTC 01:36
  workflow_dispatch:
    inputs:
      mode:
        description: 'inc=增量（默认）/ daily=按天补跑'
        required: false
        default: 'inc'
      date:
        description: 'daily 模式的日期 YYYY-MM-DD'
        required: false
        default: ''

# 仅授予本工作流推送状态文件所需的最小权限
permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMA_CLIENT_ID: ${{ secrets.IMA_CLIENT_ID }}
      IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      SOURCE: daily
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 写入登录态（Secret -> 临时目录，绝不进仓库）
        env:
          CTM_AUTH_STATE_RAW: ${{ secrets.CTM_AUTH_STATE_RAW }}
        run: |
          AUTH_PATH="$RUNNER_TEMP/auth_state.json"
          printf '%s' "$CTM_AUTH_STATE_RAW" > "$AUTH_PATH"
          echo "CTM_AUTH_STATE=$AUTH_PATH" >> "$GITHUB_ENV"
          echo "auth_state.json 字节数: $(wc -c < "$AUTH_PATH")"

      - name: 运行管线（续期登录态 -> 拉会 -> 转写 -> IMA -> 企业微信）
        run: |
          MODE="${{ github.event.inputs.mode || 'inc' }}"
          DATE="${{ github.event.inputs.date }}"
          node run.js "$MODE" "$DATE"

      - name: 提交状态文件（仅去重记录/进度，非敏感）
        if: always()
        run: |
          git config user.email "ctm-bot@users.noreply.github.com"
          git config user.name "ctm-bot"
          git add daily/
          git diff --cached --quiet || git commit -m "chore(state): update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 并发场景下两个 workflow 可能同时 push 同一分支，重试避免非快进冲突
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            if git push; then break; fi
            sleep 5
          done

      - name: 自动轮换（加密回写登录态到 Secret）
        if: always()
        env:
          GITHUB_PAT: ${{ secrets.SECRETS_WRITE_PAT }}
          SECRET_NAME: CTM_AUTH_STATE_RAW
        run: |
          export AUTH_SRC="$RUNNER_TEMP/auth_state.json"
          npm install tweetsodium --no-save --no-audit --no-fund 2>/dev/null && node rotate_secret.js || echo "::warning::轮换步骤异常（不影响会议处理），请检查 SECRETS_WRITE_PAT 是否有效"

      - name: 清理临时凭证
        if: always()
        run: rm -f "$RUNNER_TEMP/auth_state.json"
